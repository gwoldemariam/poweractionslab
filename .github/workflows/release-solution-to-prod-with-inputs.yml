name: release-solution-to-prod-reusable
# Reusable workflow:
#   1. Packs the unmanaged solution from source control
#   2. Imports it into a BUILD environment and exports it as MANAGED
#   3. Uploads the managed solution as a GitHub artifact
#   4. Imports the managed solution into PRODUCTION

on:
  workflow_call:
    inputs:
      # Change this value
      solution_name:
        description: 'Name of the solution to release'
        type: string
        default: ALMLab
      # Do not change these values
      solution_shipping_folder:
        description: 'Folder for staging the managed solution *do not change*'
        type: string
        default: out/ship/
      solution_outbound_folder:
        description: 'Folder for staging the packed solution *do not change*'
        type: string
        default: out/solutions/
      solution_source_folder:
        description: 'Folder where the unpacked solution is checked in *do not change*'
        type: string
        default: solutions/
      solution_release_folder:
        description: 'Folder where the released binaries go *do not change*'
        type: string
        default: out/release
      BUILD_ENVIRONMENT_URL:
        description: 'Build environment URL'
        type: string
        required: true
      PRODUCTION_ENVIRONMENT_URL:
        description: 'Production environment URL'
        type: string
        required: true
      CLIENT_ID:
        description: 'App registration (client) ID'
        type: string
        required: true
      TENANT_ID:
        description: 'Tenant ID'
        type: string
        required: true
    secrets:
      envSecret:
        description: 'Client secret for the app registration'
        required: true

jobs:
  convert-to-managed:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Pack solution
        uses: microsoft/powerplatform-actions/pack-solution@v1
        with:
          solution-folder: ${{ inputs.solution_source_folder }}/${{ inputs.solution_name }}
          solution-file: ${{ inputs.solution_outbound_folder }}/${{ inputs.solution_name }}.zip
          solution-type: Unmanaged

      - name: Import solution into BUILD environment as unmanaged
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ inputs.BUILD_ENVIRONMENT_URL }}
          app-id: ${{ inputs.CLIENT_ID }}
          client-secret: ${{ secrets.envSecret }}
          tenant-id: ${{ inputs.TENANT_ID }}
          solution-file: ${{ inputs.solution_outbound_folder }}/${{ inputs.solution_name }}.zip
          force-overwrite: true
          publish-changes: true

      - name: Export solution as managed
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ inputs.BUILD_ENVIRONMENT_URL }}
          app-id: ${{ inputs.CLIENT_ID }}
          client-secret: ${{ secrets.envSecret }}
          tenant-id: ${{ inputs.TENANT_ID }}
          solution-name: ${{ inputs.solution_name }}
          managed: true
          solution-output-file: ${{ inputs.solution_shipping_folder }}/${{ inputs.solution_name }}.zip

      - name: Upload managed solution artifact
        uses: actions/upload-artifact@v5
        with:
          name: managedSolutions
          path: ${{ inputs.solution_shipping_folder }}/${{ inputs.solution_name }}.zip

  release-to-production:
    needs: convert-to-managed
    runs-on: windows-latest
    steps:
      - name: Install Power Platform CLI
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Download managed solution artifact
        uses: actions/download-artifact@v5
        with:
          name: managedSolutions
          path: ${{ inputs.solution_release_folder }}

      - name: Import managed solution into PRODUCTION
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ inputs.PRODUCTION_ENVIRONMENT_URL }}
          app-id: ${{ inputs.CLIENT_ID }}
          client-secret: ${{ secrets.envSecret }}
          tenant-id: ${{ inputs.TENANT_ID }}
          solution-file: ${{ inputs.solution_release_folder }}/${{ inputs.solution_name }}.zip
          force-overwrite: true
          publish-changes: true
