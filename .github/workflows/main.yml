name: export-and-branch-solution
# Exports a solution from the DEV environment, unpacks it,
# then commits and pushes a git branch with the changes.

on:
  workflow_dispatch:
    inputs:
      # Change this value
      solution_name:
        description: 'Name of the solution to work on from Power Platform'
        required: true
        default: ALMLab
      # Do not change these values
      solution_exported_folder:
        description: 'Folder for staging the exported solution *do not change*'
        required: true
        default: out/exported/
      solution_folder:
        description: 'Staging folder for the unpacked solution before check-in *do not change*'
        required: true
        default: out/solutions/
      solution_target_folder:
        description: 'Folder to be created and checked in *do not change*'
        required: true
        default: solutions/

env:
  # Edit your values here
  ENVIRONMENT_URL: 'https://orga3464642.crm.dynamics.com/'
  CLIENT_ID: 'da820c45-85e4-4c94-9362-0282dfd375c8'
  TENANT_ID: '5748c51c-4a6e-44d1-b429-f05d15835c0b'

permissions:
  contents: write        # lets branch-solution push the new branch
  pull-requests: write

jobs:
  export-from-dev:
    runs-on: windows-latest   # ubuntu-latest also works

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Power Platform CLI (required before any other v1 action)
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: who-am-i
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.PowerPlatformSPN }}
          tenant-id: ${{ env.TENANT_ID }}

      - name: Export solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ env.ENVIRONMENT_URL }}
          app-id: ${{ env.CLIENT_ID }}
          client-secret: ${{ secrets.PowerPlatformSPN }}
          tenant-id: ${{ env.TENANT_ID }}
          solution-name: ${{ github.event.inputs.solution_name }}
          solution-output-file: ${{ github.event.inputs.solution_exported_folder }}/${{ github.event.inputs.solution_name }}.zip

      - name: Unpack solution
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: ${{ github.event.inputs.solution_exported_folder }}/${{ github.event.inputs.solution_name }}.zip
          solution-folder: ${{ github.event.inputs.solution_folder }}/${{ github.event.inputs.solution_name }}
          solution-type: 'Unmanaged'
          overwrite-files: true

      - name: Branch solution and prepare it for a pull request
        uses: microsoft/powerplatform-actions/branch-solution@v1
        with:
          solution-folder: ${{ github.event.inputs.solution_folder }}/${{ github.event.inputs.solution_name }}
          solution-target-folder: ${{ github.event.inputs.solution_target_folder }}/${{ github.event.inputs.solution_name }}
          branch-name: solution-update-${{ github.run_number }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          allow-empty-commit: true

      - name: Open a pull request into main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "solution-update-${{ github.run_number }}" \
            --title "Solution update: ${{ github.event.inputs.solution_name }} (run ${{ github.run_number }})" \
            --body "Exported from DEV by workflow run ${{ github.run_id }}. Merging this PR deploys the solution to production automatically."
